---
# =============================================================================
# Playbook : sysauto_inglist.yml
# Purpose  : Issue F <proc>,INGLIST to display the compound/desired/observed
#            state of SA z/OS-managed resources and parse the response.
#            An optional filter can narrow output to a pattern (e.g. FTP*) or
#            a specific resource fully-qualified as <name>/<type>/<system>.
#            The parsed state list is published as an AAP job artifact so it
#            is accessible via the AAP API at:
#              GET /api/v2/jobs/<id>/   →  .artifacts.sa_inglist
# Survey   :
#   sa_proc        - SA z/OS started-task PROC name (default: AUTOPROC)
#   inglist_filter - Optional resource name, mask, or full qualifier
#                    (e.g. FTP*, FTPSERVE, FTPSERVE/APL/LTE1).
#                    Leave blank to list ALL resources.
# =============================================================================
- name: SA | INGLIST - Display resource compound/desired/observed states
  hosts: zos_host
  environment: "{{ environment_vars }}"
  gather_facts: false

  vars:
    # SA z/OS PROC name — survey may override.
    sa_proc: "{{ sa_proc | default('AUTOPROC') }}"

    # Optional filter: blank = show all.
    inglist_filter: "{{ inglist_filter | default('') }}"

  tasks:

    # =========================================================================
    # Build the INGLIST command.  When inglist_filter is set, append it so SA
    # z/OS filters server-side.
    # =========================================================================
    - name: "SA | Set INGLIST command"
      ansible.builtin.set_fact:
        inglist_cmd: >-
          {{
            'F ' + sa_proc + ',INGLIST'
            + ((' ' + inglist_filter) if inglist_filter | trim | length > 0 else '')
          }}

    - name: "SA | INGLIST - Issue command: {{ inglist_cmd }}"
      ibm.ibm_zos_core.zos_operator:
        cmd: "{{ inglist_cmd }}"
        verbose: false
      register: inglist_output

    - name: "SA | INGLIST - Show raw operator response"
      ansible.builtin.debug:
        msg: "{{ inglist_output.stdout_lines }}"

    # =========================================================================
    # Parse INGLIST output into sa_inglist:
    #   [{name, type, system, compound, desired, observed}, ...]
    # Valid data line example (after strip):
    #   "FTPSERVE    APL  LTE1         SATISFACTORY AVAILABLE    AVAILABLE"
    # Columns: Name(0) Type(1) System(2) [Sus(3-opt)] Compound Desired Observed
    # Skip: blank, separator, header (Name), console noise, Sysplex line.
    # =========================================================================
    - name: "SA | INGLIST - Parse response into resource state list"
      ansible.builtin.set_fact:
        sa_inglist: >-
          {{
            sa_inglist | default([]) + [{
              'name':     (item | trim).split()[0],
              'type':     (item | trim).split()[1],
              'system':   (item | trim).split()[2],
              'compound': (item | trim).split()[3],
              'desired':  (item | trim).split()[4],
              'observed': (item | trim).split()[5]
            }]
          }}
      loop: "{{ inglist_output.stdout_lines }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('-')
        - not (item | trim).startswith('*')
        - not (item | trim).startswith('Name')
        - not (item | trim).startswith('ISF')
        - not (item | trim).startswith('LTE')
        - not (item | trim).startswith('Sysplex')
        - not (item | trim).startswith('RESPONSE=')
        - not (item | trim is search('-F '))
        - ((item | trim).split() | length) >= 6

    - name: "SA | INGLIST - Show parsed resource state list"
      ansible.builtin.debug:
        msg: "{{ sa_inglist | default([]) }}"

    # =========================================================================
    # Publish the parsed state list as an AAP artifact so it is visible
    # in the job's API response:
    #   GET /api/v2/jobs/<id>/  →  .artifacts.sa_inglist
    #   GET /api/v2/jobs/<id>/  →  .artifacts.inglist_command
    # =========================================================================
    - name: "SA | INGLIST - Publish results as AAP job artifact"
      ansible.builtin.set_stats:
        data:
          inglist_command: "{{ inglist_cmd }}"
          sa_inglist: "{{ sa_inglist | default([]) }}"
