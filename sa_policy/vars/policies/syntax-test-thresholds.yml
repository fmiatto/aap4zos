---
# =============================================================================
# File    : vars/policies/syntax-test-thresholds.yml
# Purpose : TEST PDB ONLY - the APL THRESHOLDS section, as an update of
#           SATAPL1 (created by syntax-test.yml: run that file first).
#
#   ansible-playbook -i sa_policy/inventory/local/inventory.yml \
#     sa_policy/playbooks/add_to_sa.yml \
#     -e sa_test_pdb=SYSAUTO.PROTO.TESTPDB -e sa_policies=syntax-test-thresholds \
#     --tags apply,build
# =============================================================================
sa_test_only: true
sa_update_only: true

sa_new_policy:

  apls:
    - name: SATAPL1
      thresholds:
        critical_number: 3
        critical_interval: "00:10:00"
        frequent_number: 3
        frequent_interval: "01:00:00"
        infrequent_number: 3
        infrequent_interval: "12:00:00"

  update_sections:
    thresholds: true
