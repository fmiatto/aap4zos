---
# =============================================================================
# File    : vars/sa_env.yml
# Purpose : Everything sa_policy.yml needs to know about the target system
#           (LTE1, SA 4.3).
# =============================================================================

# ---------------------------------------------------------------------------
# Policies to process, in order: file names in vars/policies/ without .yml.
#   sa_policies          add (or, update-only files, update) their entries
#   sa_policies_delete   delete every class, APG and APL the file defines
#                        (except entries with keep_on_delete: true);
#                        update-only files are refused
# Both lists go into one text file (deletes first, then adds), one build and
# one activation; a file in both lists is deleted and created again.
# A file that refers to another file's entries (a class, an APG) comes after
# it.  Override with -e sa_policies=cics62 or -e sa_policies=db2-dba1,rmf,
# -e sa_policies_delete=ims15; -e sa_policies= gives an empty list.
# ---------------------------------------------------------------------------
sa_policies:
  - db2-dba1
  - cics62
  - rmf
  - mq1

sa_policies_delete: []

# ---------------------------------------------------------------------------
# SA z/OS on the target system
# ---------------------------------------------------------------------------
sa_proc: AUTOPROC                       # NetView/SA agent STC (F AUTOPROC,...)
sa_pdb_name: LTEPLEX_PDB                # Policy Database name
sa_pdb_dsn: SYSAUTO.PDB                 # Policy Database data set
sa_config_gdg_base: SYSAUTO.PDB.SOCNTL  # Configuration GDG that SA loads

# New configuration generation, allocated like the existing ones:
# non-SMS PDSE, 3390, 40 cylinders primary, 20 secondary.
sa_config_unit: "3390"
sa_config_volume: LTECAT
sa_config_space: "CYL,(40,20,10)"       # directory quantity is ignored for a PDSE

# ---------------------------------------------------------------------------
# Libraries (SA 4.3 dialog and ISPF)
# ---------------------------------------------------------------------------
sa_dialog_hlq: SYS1.ING
sa_ispf_hlq: SYS1.ISP

sa_dialog_libs:
  - { dd: ISPLLIB, dsns: ["{{ sa_dialog_hlq }}.SINGLOAD"] }
  - { dd: ISPMLIB, dsns: ["{{ sa_dialog_hlq }}.SINGMENU", "{{ sa_ispf_hlq }}.SISPMENU"] }
  - { dd: ISPPLIB, dsns: ["{{ sa_dialog_hlq }}.SINGPENU", "{{ sa_ispf_hlq }}.SISPPENU"] }
  - { dd: ISPSLIB, dsns: ["{{ sa_dialog_hlq }}.SINGSENU", "{{ sa_ispf_hlq }}.SISPSENU"] }
  - { dd: ISPTLIB, dsns: ["{{ sa_dialog_hlq }}.SINGTENU", "{{ sa_ispf_hlq }}.SISPTENU"] }
  - { dd: SYSEXEC, dsns: ["{{ sa_dialog_hlq }}.SINGTREX"] }
  - { dd: AOFIPDB, dsns: ["{{ sa_dialog_hlq }}.SINGPDB"] }

# ---------------------------------------------------------------------------
# Work data sets (the playbook creates them)
# ---------------------------------------------------------------------------
sa_work_hlq: SYSAUTO.ANSIBLE
sa_work_pds: "{{ sa_work_hlq }}.JCL"        # JCL (FB 80)
sa_source_dsn: "{{ sa_work_hlq }}.UPD"             # text file, sequential VB
# Longest text-file line.  255 is SA's own maximum for a text-file record.
# The text file is VB, so lines are not padded with blanks (SA would count
# the padding into AT override continuation lines, max 72 characters).
sa_text_lrecl: 255
sa_report_dsn: "{{ sa_work_hlq }}.RPT"             # update report, PDS
sa_build_dsn: "{{ sa_work_hlq }}.SOCNTL"     # build output, PDSE

# ---------------------------------------------------------------------------
# PDB and build output the jobs use: sa_pdb_dsn and sa_build_dsn, or with
# -e sa_test_pdb=<dsn> a copy of the PDB (test PDB):
#   apply    copies sa_pdb_dsn into <dsn> when <dsn> does not exist (or every
#            time with -e sa_test_pdb_refresh=true) and updates <dsn>
#   build    builds <dsn> into -e sa_test_build_dsn (default <dsn>.SOCNTL)
#   activate refuses to run: a test build never goes into the GDG
#   -e sa_test_pdb=SYSAUTO.PROTO.TESTPDB -e sa_policies=example-add
# ---------------------------------------------------------------------------
sa_target_pdb_dsn: "{{ sa_test_pdb | default(sa_pdb_dsn, true) }}"
sa_target_build_dsn: >-
  {{ (sa_test_build_dsn | default(sa_test_pdb ~ '.SOCNTL', true))
     if (sa_test_pdb | default('', true) | length > 0) else sa_build_dsn }}

# ---------------------------------------------------------------------------
# Batch jobs
#   //SATXUPD  JOB MSGCLASS=X,CLASS=A,NOTIFY=&SYSUID,
#   //         REGION=0M,TIME=NOLIMIT
# ---------------------------------------------------------------------------
sa_job:
  prefix: SA                      # job name = prefix + TXUPD | BUILD | NEWGEN
  account: ''
  programmer: ''
  class: A
  msgclass: X
  notify: '&SYSUID'
  region: 0M
  time: NOLIMIT
  poll_retries: 60                # 60 x 10s = 10 minutes
  poll_delay: 10

# A job fails on a completion code above its max_rc or on one of these lines.
sa_fail_message_regex: '\b(AOF|ING|ISP|IKJ)[A-Z0-9]{3,6}[EWS]\b|\bERROR\b|\bWARNING\b|REXX error condition|Invalid data set status'

sa_refresh_wait: 30               # seconds to collect the INGAMS REFRESH response

# ---------------------------------------------------------------------------
# Text-file update: SYS1.ING.SINGSAMP(INGEBFLT)
#   AOFFBFL1 pdb_name, DD:PDB, DD:PDBUPD, DD:PDBRPT
#   PDB is sa_target_pdb_dsn.  PDBUPD must be sequential (AOFFBFL1 opens it
#   by data set name and drops a member name); PDBRPT must be a PDS
#   (LMINIT ENQ(SHRW)).
# ---------------------------------------------------------------------------
sa_textupd:
  max_rc: 0
  dd:
    - { name: AOFTABL, spec: "SPACE=(TRK,(15,15,15)),RECFM=FB,LRECL=80,DSORG=PO" }
    - { name: PDB, spec: "DISP=OLD,DSN={{ sa_target_pdb_dsn }}" }
    - { name: PDBUPD, spec: "DISP=OLD,DSN={{ sa_source_dsn }}" }
    - { name: PDBRPT, spec: "DISP=OLD,DSN={{ sa_report_dsn }}" }
    - { name: ISPWRK1, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPWRK2, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPWRK3, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPWRK4, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPCTL0, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL1, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL2, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL3, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL4, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: SYSPRINT, spec: "SYSOUT=*" }
    - { name: SYSOUT, spec: "SYSOUT=*" }
  systsin:
    - " ISPSTART CMD(AOFFBFL1 +"
    - "              {{ sa_pdb_name }}, +"
    - "              DD:PDB, +"
    - "              DD:PDBUPD, +"
    - "              DD:PDBRPT) +"
    - "              NEWAPPL(AOF) BDISPMAX(999999)"

# ---------------------------------------------------------------------------
# Build: SYS1.ING.SINGSAMP(INGEBBLD), always a full build (ALL) of
# sa_target_pdb_dsn into an empty sa_target_build_dsn.
#   AOFFBBL1 type, name, ALL|MODIFIED, sysplex, option, config,
#            DD:PDB, pdb_name, enterprise, DD:SOCNTL
#   Enterprise * = the name stored in the PDB.
# ---------------------------------------------------------------------------
sa_build:
  max_rc: 0
  dd:
    - { name: PDB, spec: "DISP=SHR,DSN={{ sa_target_pdb_dsn }}" }
    - { name: SOCNTL, spec: "DISP=OLD,DSN={{ sa_target_build_dsn }}" }
    - { name: ISPWRK1, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPWRK2, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPWRK3, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPWRK4, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=256,RECFM=FB" }
    - { name: ISPCTL0, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL1, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL2, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL3, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: ISPCTL4, spec: "UNIT=SYSALLDA,SPACE=(CYL,(5,10)),LRECL=80,RECFM=FB" }
    - { name: SYSPRINT, spec: "SYSOUT=*" }
    - { name: SYSOUT, spec: "SYSOUT=*" }
  systsin:
    - " ISPSTART CMD(AOFFBBL1 *,+"
    - "                       *,+"
    - "                       ALL,+"
    - "                       *,+"
    - "                       1,+"
    - "                       0,+"
    - "                       DD:PDB,+"
    - "                       {{ sa_pdb_name }},+"
    - "                       *,+"
    - "                       DD:SOCNTL) +"
    - "                       NEWAPPL(AOF) BDISPMAX(999999)"
