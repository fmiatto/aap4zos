---
# =============================================================================
# File    : vars/policies/rmf.yml   (sa_policies name: rmf)
# Purpose : Update the existing APL RMF so SA starts it after every IPL.
#
#   Without the field, RMF takes Restart after IPL MAYBE from its class
#   C_APPL: when RMF was stopped outside SA before an IPL, the agent sets it
#   to STOPPED after the IPL and SA does not start it.  JES2 (class C_JES2,
#   START) is restarted in the same situation.
#
# Only APPLICATION INFO / Restart after IPL is written ("field replacement"):
# RMF's other fields, its HASPARENT JES2 relationship, the ERB306D reply and
# its BASE_SYS membership stay as they are.
# =============================================================================
# Update-only: RMF already exists in the PDB, so no NEW sections and no
# apg:, only the UPD section.  Other files of the same run keep their own
# setting.
sa_update_only: true

sa_new_policy:

  apls:
    - name: RMF                       # existing entry; only name + fields to change
      restart_after_ipl: START

  # ---------------------------------------------------------------------------
  # update_sections - the UPD parts this file writes (left out = off).  A part
  # is written only for entries that have data for it (fields: README).
  #   apg               APG long_description, automation_name, behavior,
  #                     automatically_link (field), relationships (policy)
  #   description       long_description; in update-only files also
  #                     description (field)
  #   application_info  command_prefix, restart_after_ipl, external_startup,
  #                     external_shutdown, skip_active_status (field)
  #   relationships     replaces all relationships of the entry (policy)
  #   messages          replaces all messages of the entry (block)
  #   startup           replaces all start commands (block)
  #   shutdown          replaces all stop commands (block)
  #   thresholds        the entry's error thresholds (field)
  #   minor_resources   replaces all minor resources (block)
  #   db2_control       DB2 subsystem ID and active log, APLs only (policy)
  # ---------------------------------------------------------------------------
  update_sections:
    application_info: true            # Restart after IPL: START
    relationships: false              # keep RMF's HASPARENT JES2
    shutdown: false                   # keep the class shutdown
