---
# =============================================================================
# File    : vars/policies/mq1.yml   (sa_policies name: mq1)
# Purpose : IBM MQ queue manager MQ1 on LTE1: the queue manager (ZQSXMSTR),
#           its channel initiator (ZQSXCHIN) and the MQ web console (MQWEB)
#           as one APG.
#
#   ZQSXMSTR, ZQSXCHIN -> no class: their start and stop commands and the
#                         "is available" messages (AT status UP) are set here.
#   MQWEB              -> no category, class C_APPL (generic STC).
#
# Start order: the APG waits for TCPIP; CHIN and MQWEB wait for ZQSXMSTR.
# The CHIN commands use &SUBPCMDPFX, the command prefix of its parent
# ZQSXMSTR (+MQ1).
# =============================================================================
# Full add: NEW sections create the entries, then the UPD sections.
# true = UPD sections only, for entries that already exist
# (-e sa_update_only=true does that for every file of a run).
sa_update_only: false

sa_new_policy:

  apg:
    name: MQ1_MQ
    type: SYSTEM
    nature: BASIC
    description: IBM MQ queue manager MQ1
    long_description:                 # max 5 lines x 50 characters
      - Queue manager MQ1, its channel initiator
      - and the MQ web console
    systems:
      - LTE1
    relationships:                    # the whole group waits for TCPIP
      - { type: HASPARENT, resource: TCPIP/APL/= }

  apls:
    - name: ZQSXMSTR
      subsystem: ZQSXMSTR
      job_name: ZQSXMSTR
      job_type: MVS
      category: MQ
      subcategory: MSTR
      description: IBM MQ queue manager MQ1
      command_prefix: "+MQ1"
      # Commands and message texts: max 212 characters, replies 61.
      startup:
        - phase: STARTUP              # PRESTART | STARTUP | POSTSTART
          mixed_case: "NO"
          commands:
            - { command: "MVS &SUBSCMDPFX START QMGR" }
      shutdown:
        - phase: NORM
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS &SUBSCMDPFX STOP QMGR" }
            - { pass: 3, command: "MVS P &SUBSJOB" }
            - { pass: 4, command: "MVS C &SUBSJOB" }
        - phase: IMMED
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS &SUBSCMDPFX STOP QMGR MODE(FORCE)" }
            - { pass: 2, command: "MVS C &SUBSJOB" }
        - phase: FORCE
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS C &SUBSJOB" }
      messages:
        - id: CSQY022I
          description: Queue manager is available
          at: { status: UP }          # AT application status

    - name: ZQSXCHIN
      subsystem: ZQSXCHIN
      job_name: ZQSXCHIN
      job_type: MVS
      category: MQ
      subcategory: CHIN
      description: IBM MQ channel initiator MQ1
      # Plain HASPARENT: SA starts and stops CHIN itself with the commands
      # below, once ZQSXMSTR is up.  (StartsMeAndStopsMe would mean the queue
      # manager starts CHIN; that needs external_startup and
      # external_shutdown ALWAYS instead of commands.)
      relationships:
        - type: HASPARENT
          resource: ZQSXMSTR/APL/=
          description: CHIN needs the queue manager
      startup:
        - phase: STARTUP
          mixed_case: "NO"
          commands:
            - { command: "MVS &SUBPCMDPFX START CHINIT" }
      shutdown:
        - phase: NORM
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS &SUBPCMDPFX STOP CHINIT" }
            - { pass: 3, command: "MVS P &SUBSJOB" }
            - { pass: 4, command: "MVS C &SUBSJOB" }
        - phase: IMMED
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS &SUBPCMDPFX STOP CHINIT" }
            - { pass: 2, command: "MVS C &SUBSJOB" }
        - phase: FORCE
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS C &SUBSJOB" }
      messages:
        - id: CSQX022I
          description: Channel initiator is available
          at: { status: UP }

    # No category: a generic STC through C_APPL.
    - name: MQWEB
      subsystem: MQWEB
      job_name: MQWEB
      job_type: MVS
      link_to_class: C_APPL
      description: IBM MQ web console
      relationships:
        - { type: HASPARENT, resource: ZQSXMSTR/APL/= }

  # ---------------------------------------------------------------------------
  # update_sections - the UPD parts this file writes (left out = off).  A part
  # is written only for entries that have data for it (fields: README).
  #   apg               APG long_description, automation_name, behavior,
  #                     automatically_link (field), relationships (policy)
  #   description       long_description; in update-only files also
  #                     description (field)
  #   application_info  command_prefix, restart_after_ipl, external_startup,
  #                     external_shutdown, skip_active_status (field)
  #   relationships     replaces all relationships of the entry (policy)
  #   messages          replaces all messages of the entry (block)
  #   startup           replaces all start commands (block)
  #   shutdown          replaces all stop commands (block)
  #   thresholds        the entry's error thresholds (field)
  #   minor_resources   replaces all minor resources (block)
  #   db2_control       DB2 subsystem ID and active log, APLs only (policy)
  # ---------------------------------------------------------------------------
  update_sections:
    apg: true                         # MQ1_MQ long description, HASPARENT TCPIP
    description: true                 # long descriptions
    application_info: true            # ZQSXMSTR: command prefix +MQ1
    relationships: true
    messages: true                    # CSQY022I / CSQX022I -> UP
    startup: true                     # no class: start commands here
    shutdown: true                    # no class: stop commands here
    db2_control: false
