---
# =============================================================================
# Playbook : grant_db2_to_sa.yml   (standalone)
# Purpose  : Let SA z/OS issue DB2 commands, so INGREQ STOP of a DB2
#            subsystem works.
#
# Why: SA's DB2 shutdown first runs INGDB2 CHECK_INDOUBT, which issues
#   -DBA1 DIS THD(*) TYPE(INDOUBT) from an SA autotask console (AUTGSSE1).
#   DB2 rejected it:
#     DSN9016I -DBA1 '-DIS THD' COMMAND REJECTED, UNAUTHORIZED REQUEST
#     HSAL6010A DBA1MSTR/APL/LTE1; INTERVENTION REQUIRED; BEYOND AUTOMATION
#
# Who DB2 sees: the SA autotasks (AUTGSS, AUTBASE, AUTSHUT, AUTWRKnn, ...)
#   have no RACF user IDs of their own, so commands from their consoles run
#   under the user ID of the NetView/SA started task (D A,AUTOPROC ->
#   USERID=AUTOPROC).  One grant to that user ID covers every SA autotask
#   and console.
#
# What: DB2 system privilege SYSOPR (DISPLAY, STOP DB2, ... - the operator
#   commands SA uses) granted with SQL, through DSNTEP2 in batch:
#     GRANT SYSOPR TO <SA user ID>;
#   then SYSIBM.SYSUSERAUTH is queried to show the grant.
#   DBA1 has no RACF profiles in class DSNADM (only DBS1.SYSADM exists), so
#   its access-control exit defers to DB2's own GRANTs.
#
# The job runs under the Ansible user, which needs SYSADM, SYSCTRL or
# ACCESSCTRL in DB2 to grant SYSOPR.
#
# Run:
#   ansible-playbook -i sa_policy/inventory/local/inventory.yml sa_policy/playbooks/grant_db2_to_sa.yml
#   Other subsystem:  -e db2_ssid=DBB1 -e db2_hlq=DB2V13.DB2.DBB1 ...
# =============================================================================
- name: SA | Grant DB2 operator authority to System Automation
  hosts: zos_host
  environment: "{{ environment_vars }}"
  gather_facts: false

  vars:
    sa_proc: AUTOPROC                          # NetView/SA started task
    db2_ssid: DBA1                             # DB2 subsystem (command prefix -DBA1)
    db2_privilege: SYSOPR                      # DB2 system privilege to grant
    db2_sdsnexit: DB2V13.DB2.DBA1.SDSNEXIT     # from the DBA1MSTR proc (LIB=)
    db2_sdsnload: DB2V13.DB2.SDSNLOAD
    db2_runlib: DB2V13.DB2.DBA1.RUNLIB.LOAD    # holds DSNTEP2
    db2_tep2_plan: DSNTEP13                    # DSNTEP!! plan, !! = Db2 13
    # User IDs to grant to; empty = the user ID of the sa_proc started task
    db2_grantees: []
    job_name: SAPGRANT
    job_class: A
    job_msgclass: X
    work_pds: SYSAUTO.PROTO.SAPDB.WORK         # the JCL is stored here as (GRANT)

  tasks:

    # =========================================================================
    # Who does SA run as?
    # =========================================================================
    - name: "SA | D A,{{ sa_proc }}"
      ibm.ibm_zos_core.zos_operator:
        cmd: "D A,{{ sa_proc }}"
      register: sa_da

    - name: "SA | User IDs to grant {{ db2_privilege }} to"
      ansible.builtin.set_fact:
        sa_grantees: >-
          {{ db2_grantees if db2_grantees | length > 0 else
             (sa_da.stdout | regex_findall('USERID=([A-Z0-9@#$]+)') | unique) }}

    - name: "SA | Stop if the SA user ID was not found"
      ansible.builtin.assert:
        that: sa_grantees | length > 0
        fail_msg: "No USERID= in D A,{{ sa_proc }}: {{ sa_da.stdout_lines }}"
        success_msg: "Granting {{ db2_privilege }} on {{ db2_ssid }} to {{ sa_grantees | join(', ') }}"

    # =========================================================================
    # GRANT and check, in one DSNTEP2 job
    # =========================================================================
    - name: "SA | Work PDS {{ work_pds }}"
      ibm.ibm_zos_core.zos_data_set:
        name: "{{ work_pds }}"
        type: pds
        record_format: fb
        record_length: 80
        space_primary: 5
        space_secondary: 5
        space_type: cyl
        directory_blocks: 20
        state: present

    - name: "SA | Write the job to {{ work_pds }}(GRANT)"
      ibm.ibm_zos_core.zos_copy:
        dest: "{{ work_pds }}(GRANT)"
        replace: true
        content: |
          //{{ job_name }} JOB CLASS={{ job_class }},MSGCLASS={{ job_msgclass }},NOTIFY=&SYSUID,
          //         REGION=0M,TIME=NOLIMIT
          //*-------------------------------------------------------------------
          //* Grant {{ db2_privilege }} on {{ db2_ssid }} to SA ({{ sa_grantees | join(' ') }})
          //* Generated by sa_policy/playbooks/grant_db2_to_sa.yml
          //*-------------------------------------------------------------------
          //GRANT    EXEC PGM=IKJEFT01,DYNAMNBR=20
          //STEPLIB  DD DISP=SHR,DSN={{ db2_sdsnexit }}
          //         DD DISP=SHR,DSN={{ db2_sdsnload }}
          //SYSTSPRT DD SYSOUT=*
          //SYSPRINT DD SYSOUT=*
          //SYSUDUMP DD SYSOUT=*
          //SYSTSIN  DD *
           DSN SYSTEM({{ db2_ssid }})
           RUN PROGRAM(DSNTEP2) PLAN({{ db2_tep2_plan }}) -
               LIB('{{ db2_runlib }}')
           END
          /*
          //SYSIN    DD *
          {% for u in sa_grantees %}
            GRANT {{ db2_privilege }} TO {{ u }};
          {% endfor %}
            SELECT GRANTEE, GRANTOR, SYSOPRAUTH, SYSCTRLAUTH, SYSADMAUTH
              FROM SYSIBM.SYSUSERAUTH
             WHERE GRANTEE IN ('{{ sa_grantees | join("', '") }}');
          /*

    # zos_job_submit cannot see the job's steps on LTE1 and never notices the
    # end (JOB00583 ended CC 0000, the module timed out after 120s).  Submit
    # only, then poll the completion code, as run_job.yml does.
    - name: "SA | Submit {{ work_pds }}(GRANT)"
      ibm.ibm_zos_core.zos_job_submit:
        src: "{{ work_pds }}(GRANT)"
        remote_src: true
        wait_time: 0
      register: sa_submit

    - name: "SA | Wait for {{ sa_submit.jobs[0].job_id }} to complete"
      ibm.ibm_zos_core.zos_job_output:
        job_id: "{{ sa_submit.jobs[0].job_id }}"
      register: sa_job
      until: >-
        (sa_job.jobs | default([]) | length > 0) and
        ((sa_job.jobs[0].ret_code | default({}, true)).msg | default('AC', true))
          not in ['AC', '?', 'INPUT', 'HOLD']
      retries: 30
      delay: 5

    - name: "SA | Job output"
      ansible.builtin.shell: |
        for dd in SYSTSPRT SYSPRINT; do
          echo "#@DD $dd"
          pjdd {{ sa_job.jobs[0].job_id }} $dd 2>/dev/null | cut -c2- | sed 's/ *$//'
        done | tr -cd '[:alnum:][:space:][:punct:]'
      register: sa_out
      changed_when: false

    - name: "SA | Result"
      ansible.builtin.debug:
        msg: >-
          {{ ['Job ' ~ sa_job.jobs[0].job_id ~ ' ended ' ~ (sa_job.jobs[0].ret_code.msg | default('?'))
              ~ ' ' ~ (sa_job.jobs[0].ret_code.code | default('?'))]
             + (sa_out.stdout_lines | select('search', 'GRANT|SQLCODE|SUCCESSFUL|DSNE|DSNT|AUTOPROC|GRANTEE|SYSOPR|' ~ (sa_grantees | join('|'))) | list) }}

    - name: "SA | The grant must have worked"
      ansible.builtin.assert:
        that:
          - (sa_job.jobs[0].ret_code.code | default(99) | int) <= 4
          - sa_out.stdout is not search('SQLCODE = -')
        fail_msg: >-
          GRANT failed (see Result above). SQLCODE -551/-552 means the Ansible user
          lacks SYSADM/SYSCTRL/ACCESSCTRL in {{ db2_ssid }}: run the job as DB2's
          install SYSADM user, or have a DB2 administrator issue
          GRANT {{ db2_privilege }} TO {{ sa_grantees | join(', ') }};
        success_msg: >-
          {{ db2_privilege }} granted on {{ db2_ssid }} to {{ sa_grantees | join(', ') }}.
          Test: INGREQ DBA1MSTR/APL/LTE1 REQ=STOP, then REQ=START.
