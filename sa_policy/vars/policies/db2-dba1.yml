---
# =============================================================================
# File    : vars/policies/db2-dba1.yml   (sa_policies name: db2-dba1)
# Purpose : DB2 subsystem DBA1 (MSTR, IRLM, DBM1, DIST) on LTE1: one APG and
#           its APLs.  Each APL links to a DB2 class of the PDB (C_DB2_NORM,
#           C_DB2_DEPENDENTS) and inherits its start, stop and message
#           policy; this file adds identity, descriptions, relationships,
#           the command prefix and DB2 CONTROL.
#
# Start order: DBA1MSTR waits for the whole BASE_SYS group; SA starts
# DBA1MSTR, and DBA1MSTR starts and stops IRLM, DBM1 and DIST
# (StartsMeAndStopsMe; C_DB2_DEPENDENTS sets external startup and shutdown
# ALWAYS for them).
#
# APG membership: every APL joins this file's APG (apgs: on an APL changes
# that), and the APG is linked to the systems in apg.systems.
# =============================================================================
# Full add: NEW sections create the entries, then the UPD sections.
# true = UPD sections only, for entries that already exist
# (-e sa_update_only=true does that for every file of a run).
sa_update_only: false

sa_new_policy:

  apg:
    name: DBA1_DB2                    # max 20 characters
    type: SYSTEM                      # SYSTEM | SYSPLEX
    nature: BASIC                     # BASIC | MOVE | SERVER
    description: DB2 subsystem DBA1   # max 40 characters
    long_description:                 # max 5 lines x 50 characters
      - All DB2 DBA1 address spaces on LTE1
    systems:                          # systems the APG is linked to
      - LTE1

  apls:
    - name: DBA1MSTR
      subsystem: DBA1MSTR
      job_name: DBA1MSTR
      job_type: MVS                   # MVS | NONMVS | TRANSIENT
      category: DB2
      subcategory: MSTR
      link_to_class: C_DB2_NORM
      description: DB2 DBA1 - system services (MSTR)
      long_description:               # max 5 lines x 50 characters
        - Starts and stops IRLM, DBM1 and DIST
      command_prefix: "-DBA1"
      # DB2 CONTROL: the DB2 subsystem SA monitors through this APL.
      # active_log_dataset: the DBA1 active log data set name (from
      # -DBA1 DISPLAY LOG or the DSNJU004 log map), not set here.
      db2_control:
        subsystem_id: DBA1            # 1-4 characters
      # DB2 starts only after the whole base system group is AVAILABLE (all
      # its members), and is stopped before it.  Only MSTR needs this: SA
      # starts MSTR, and MSTR starts IRLM, DBM1 and DIST (StartsMeAndStopsMe).
      relationships:
        - { type: HASPARENT, resource: BASE_SYS/APG/= }

    - name: DBA1IRLM
      subsystem: DBA1IRLM
      job_name: DBA1IRLM
      job_type: MVS
      category: DB2
      subcategory: IRLM
      link_to_class: C_DB2_DEPENDENTS
      description: DB2 DBA1 - lock manager (IRLM)
      long_description:
        - Lock manager, started by DBA1MSTR
      relationships:
        - { type: HASPARENT, resource: DBA1MSTR/APL/=, condition: StartsMeAndStopsMe }

    - name: DBA1DBM1
      subsystem: DBA1DBM1
      job_name: DBA1DBM1
      job_type: MVS
      category: DB2
      subcategory: DBM1
      link_to_class: C_DB2_DEPENDENTS
      description: DB2 DBA1 - database services (DBM1)
      long_description:
        - Database services, started by DBA1MSTR
      relationships:
        - { type: HASPARENT, resource: DBA1MSTR/APL/=, condition: StartsMeAndStopsMe }

    - name: DBA1DIST
      subsystem: DBA1DIST
      job_name: DBA1DIST
      job_type: MVS
      category: DB2
      subcategory: DIST
      link_to_class: C_DB2_DEPENDENTS
      description: DB2 DBA1 - distributed data (DIST)
      long_description:
        - Distributed data, started by DBA1MSTR
      relationships:
        - { type: HASPARENT, resource: DBA1MSTR/APL/=, condition: StartsMeAndStopsMe }

  # ---------------------------------------------------------------------------
  # update_sections - the UPD parts this file writes (left out = off).  A part
  # is written only for entries that have data for it (fields: README).
  #   apg               APG long_description, automation_name, behavior,
  #                     automatically_link (field), relationships (policy)
  #   description       long_description; in update-only files also
  #                     description (field)
  #   application_info  command_prefix, restart_after_ipl, external_startup,
  #                     external_shutdown, skip_active_status (field)
  #   relationships     replaces all relationships of the entry (policy)
  #   messages          replaces all messages of the entry (block)
  #   startup           replaces all start commands (block)
  #   shutdown          replaces all stop commands (block)
  #   thresholds        the entry's error thresholds (field)
  #   minor_resources   replaces all minor resources (block)
  #   db2_control       DB2 subsystem ID and active log, APLs only (policy)
  # ---------------------------------------------------------------------------
  update_sections:
    apg: true                         # DBA1_DB2 long description
    description: true                 # long descriptions
    application_info: true            # DBA1MSTR: command prefix -DBA1
    relationships: true               # MSTR -> BASE_SYS, IRLM/DBM1/DIST -> MSTR
    messages: false                   # the DB2 classes carry the messages
    startup: false                    # the DB2 classes carry the startup
    shutdown: false                   # the DB2 classes carry the shutdown
    db2_control: true                 # DBA1MSTR: subsystem DBA1
