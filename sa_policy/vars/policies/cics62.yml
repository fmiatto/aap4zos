---
# =============================================================================
# File    : vars/policies/cics62.yml   (sa_policies name: cics62)
# Purpose : CICS region CICS62 on LTE1: one APG and its APL, on the class
#           C_CICS.
#
#   CICS62     -> STC, PROC CICS62 in SYS1.USER.PROCLIB (PGM=DFHSIP,PARM=SI).
#   C_CICS     -> class "Class for CICS", category CICS: STARTUP
#                 AUTO/COLD/INITIAL/NORM  MVS S &SUBSJOB,PARM='SI,START=...',
#                 CICS message handling, replies DFHSI1578D GO, DFHKE0408D ASIS.
#                 It has no shutdown commands: this file sets CICS62's own
#                 (CEMT P SHUT / CEMT P SHUT IMMED / C &SUBSJOB).
#
# Start order: HASPARENT on the APG BASE_SYS.  A BASIC APG is AVAILABLE only
# when all its members are, so SA starts CICS62 after the base z/OS tasks.
# =============================================================================
# Full add: NEW sections create the entries, then the UPD sections.
# true = UPD sections only, for entries that already exist
# (-e sa_update_only=true does that for every file of a run).
sa_update_only: false

sa_new_policy:

  apg:
    name: CICS62_CICS
    type: SYSTEM
    nature: BASIC
    description: CICS region CICS62
    long_description:                 # max 5 lines x 50 characters
      - CICS TS region CICS62 on LTE1
    systems:
      - LTE1

  apls:
    - name: CICS62
      subsystem: CICS62
      job_name: CICS62
      job_type: MVS
      category: CICS                  # TYPE=CICS, no subtype (as CICS0001)
      link_to_class: C_CICS
      description: CICS region CICS62
      long_description:               # max 5 lines x 50 characters
        - CICS TS region, PROC CICS62 in SYS1.USER.PROCLIB
      relationships:
        - { type: HASPARENT, resource: BASE_SYS/APG/= }
      # Phases NORM | IMMED | FORCE; each pass: pass number, command (max 212
      # characters), optional function (Automated Function/'*').
      shutdown:
        - phase: NORM
          passes:
            - { pass: 1, command: "MVS F &SUBSJOB,CEMT P SHUT" }
            - { pass: 2, command: "MVS F &SUBSJOB,CEMT P SHUT IMMED" }
            - { pass: 4, command: "MVS C &SUBSJOB" }

  # ---------------------------------------------------------------------------
  # update_sections - the UPD parts this file writes (left out = off).  A part
  # is written only for entries that have data for it (fields: README).
  #   apg               APG long_description, automation_name, behavior,
  #                     automatically_link (field), relationships (policy)
  #   description       long_description; in update-only files also
  #                     description (field)
  #   application_info  command_prefix, restart_after_ipl, external_startup,
  #                     external_shutdown, skip_active_status (field)
  #   relationships     replaces all relationships of the entry (policy)
  #   messages          replaces all messages of the entry (block)
  #   startup           replaces all start commands (block)
  #   shutdown          replaces all stop commands (block)
  #   thresholds        the entry's error thresholds (field)
  #   minor_resources   replaces all minor resources (block)
  #   db2_control       DB2 subsystem ID and active log, APLs only (policy)
  # ---------------------------------------------------------------------------
  update_sections:
    apg: true                         # CICS62_CICS long description
    description: true                 # long descriptions
    application_info: false           # nothing to set
    relationships: true               # CICS62 -> BASE_SYS group
    messages: false                   # C_CICS carries the messages
    startup: false                    # C_CICS carries the startup
    shutdown: true                    # C_CICS has no shutdown commands
    db2_control: false
