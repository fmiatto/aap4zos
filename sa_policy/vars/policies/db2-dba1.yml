---
# =============================================================================
# File    : vars/policies/db2-dba1.yml   (sa_policies name: db2-dba1)
# Purpose : DB2 subsystem DBA1 (MSTR, IRLM, DBM1, DIST) on LTE1: one APG and
#           its APLs.  DBA1MSTR waits for the whole BASE_SYS group.
#           Each APL links to a DB2 class that already exists in the PDB
#           (C_DB2_NORM, C_DB2_DEPENDENTS), so it inherits start, stop and
#           message policy; this file only adds identity, links and
#           relationships.
#
# How the APG and the APLs are connected:
#   There is no key for it: every APL listed under apls: joins the APG of
#   this file.  templates/apl.txt.j2 writes, after each NEW APL block,
#     WHERE_USED APG      : <apg.name>     (APL becomes a member of the APG)
#   and after the NEW APG block, for each entry in apg.systems,
#     WHERE_USED SYS      : <system>       (APG is linked to the system)
#   So the APLs reach the system through the APG.
#
#   One file means exactly one APG, and every APL in it joins that APG.
#   You can't put an APL in two APGs, or split one file's APLs across
#   groups.  For those cases use separate files (as with cics62.yml, listed
#   after this one in sa_policies), or the template would need a per-APL APG
#   list.
#
#   Relationships (HASPARENT ...) do not change membership; they only set
#   the start and stop order.
# =============================================================================
# DB2 DBA1 is new on the system: full add, NEW + UPD sections.
# true would write only the UPD sections (entries that already exist).
# -e sa_update_only=true on the command line overrides this for every file.
sa_update_only: false

sa_new_policy:

  apg:
    name: DBA1_DB2                    # max 20 characters
    type: SYSTEM                      # SYSTEM | SYSPLEX
    nature: BASIC                     # BASIC | MOVE | SERVER
    description: DB2 subsystem DBA1   # max 40 characters
    systems:                          # systems the APG is linked to
      - LTE1

  apls:
    - name: DBA1MSTR
      subsystem: DBA1MSTR
      job_name: DBA1MSTR
      job_type: MVS                   # MVS | NONMVS | TRANSIENT
      category: DB2
      subcategory: MSTR
      link_to_class: C_DB2_NORM
      description: DB2 DBA1 - system services (MSTR)
      command_prefix: "-DBA1"
      # DB2 starts only after the whole base system group is AVAILABLE (all
      # its members), and is stopped before it.  Only MSTR needs this: SA
      # starts MSTR, and MSTR starts IRLM, DBM1 and DIST (StartsMeAndStopsMe).
      relationships:
        - { type: HASPARENT, resource: BASE_SYS/APG/= }

    - name: DBA1IRLM
      subsystem: DBA1IRLM
      job_name: DBA1IRLM
      job_type: MVS
      category: DB2
      subcategory: IRLM
      link_to_class: C_DB2_DEPENDENTS
      description: DB2 DBA1 - lock manager (IRLM)
      relationships:
        - { type: HASPARENT, resource: DBA1MSTR/APL/=, condition: StartsMeAndStopsMe }

    - name: DBA1DBM1
      subsystem: DBA1DBM1
      job_name: DBA1DBM1
      job_type: MVS
      category: DB2
      subcategory: DBM1
      link_to_class: C_DB2_DEPENDENTS
      description: DB2 DBA1 - database services (DBM1)
      relationships:
        - { type: HASPARENT, resource: DBA1MSTR/APL/=, condition: StartsMeAndStopsMe }

    - name: DBA1DIST
      subsystem: DBA1DIST
      job_name: DBA1DIST
      job_type: MVS
      category: DB2
      subcategory: DIST
      link_to_class: C_DB2_DEPENDENTS
      description: DB2 DBA1 - distributed data (DIST)
      relationships:
        - { type: HASPARENT, resource: DBA1MSTR/APL/=, condition: StartsMeAndStopsMe }

  # ---------------------------------------------------------------------------
  # update_sections - which UPD sections the text file gets.
  #   The NEW sections create the APG and the APLs (identity, class link, APG
  #   membership).  Everything else an APL needs is written afterwards in one
  #   "UPD APL" section per APL, made of the parts switched on here.  A part
  #   is only written for APLs that have data for it.
  #     application_info  command_prefix / restart_after_ipl
  #                       (field replacement: only these fields change)
  #     relationships     relationships:
  #                       (policy replacement: replaces ALL relationships of
  #                       the APL, so list every one it should have)
  #     shutdown          shutdown:
  #                       (block replacement: replaces the APL's shutdown
  #                       commands)
  #   sa_update_only: false (top of this file), so it is a full add: NEW + UPD.
  #   With sa_update_only: true (file or -e) only the UPD sections are
  #   written, to change APLs that already exist.
  # ---------------------------------------------------------------------------
  update_sections:
    application_info: true            # DBA1MSTR: command prefix -DBA1
    relationships: true               # MSTR -> BASE_SYS, IRLM/DBM1/DIST -> MSTR
    shutdown: false                   # the DB2 classes carry the shutdown
