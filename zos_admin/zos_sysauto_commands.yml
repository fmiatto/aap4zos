---
# =============================================================================
# Playbook : zos_sysauto_commands.yml
# Purpose  : Issue IBM System Automation for z/OS (SA z/OS) console commands
#            via z/OS operator MODIFY (F) to demonstrate key SA capabilities:
#              1. DISPSTAT  - display and parse ALL subsystem resource statuses
#              2. INGLIST   - display and parse ALL resources (compound/desired/
#                             observed states) then single-resource for checks
#              3. INGREQ REQ=STOP   - create an operator STOP request
#              4. INGVOTE           - view the current vote table for a resource
#              5. INGSET CANCEL     - cancel the STOP request to allow recovery
#              6. INGLIST (single)  - confirm final resource state
# Usage    : ansible-playbook zos_admin/zos_sysauto_commands.yml \
#               -e "target_resource=FTPSERVE" \
#               -e "target_type=APL" \
#               -e "target_system=LTE1"
# =============================================================================
- name: IBM System Automation for z/OS - Console Commands Demo
  hosts: zos_host
  environment: "{{ environment_vars }}"
  gather_facts: false

  vars:
    # ------------------------------------------------------------------
    # SA z/OS started-task / PROC name.
    # ------------------------------------------------------------------
    sa_proc: "AUTOPROC"

    # ------------------------------------------------------------------
    # Resource to act on with INGVOTE / INGLIST.
    # Override all three on the command line with -e as needed.
    # The fully-qualified SA name is: <resource>/<type>/<system>
    # ------------------------------------------------------------------
    target_resource: "FTPSERVE"
    target_type:     "APL"
    target_system:   "LTE1"

  tasks:

    # =========================================================================
    # 1. DISPSTAT - Display status of ALL resources managed by SA z/OS
    # =========================================================================
    - name: "SA | DISPSTAT - Display all subsystem statuses"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},DISPSTAT"
        verbose: false
      register: dispstat_output

    - name: "SA | DISPSTAT - Show raw operator response"
      ansible.builtin.debug:
        msg: "{{ dispstat_output.stdout_lines }}"

    # -------------------------------------------------------------------------
    # Parse DISPSTAT into sa_resources: [{resource, status, system}, ...]
    # Valid data line (after strip):
    #   "FTPSERVE    UP       LTE1     FTPSERVE - - - - - -  MVS      --none--"
    # Skip: blank, separator (---), footer (***), column header, console noise.
    # -------------------------------------------------------------------------
    - name: "SA | DISPSTAT - Parse response into resource list"
      ansible.builtin.set_fact:
        sa_resources: >-
          {{
            sa_resources | default([]) + [{
              'resource': (item | trim).split()[0],
              'status':   (item | trim).split()[1],
              'system':   (item | trim).split()[2]
            }]
          }}
      loop: "{{ dispstat_output.stdout_lines }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('-')
        - not (item | trim).startswith('*')
        - not (item | trim).startswith('Resource')
        - not (item | trim).startswith('ISF')
        - not (item | trim).startswith('LTE')
        - not (item | trim is search('-F '))
        - ((item | trim).split() | length) >= 3

    - name: "SA | DISPSTAT - Show parsed resource list"
      ansible.builtin.debug:
        msg: "{{ sa_resources }}"

    # =========================================================================
    # 2. INGLIST - Display compound/desired/observed state of ALL resources
    # =========================================================================
    - name: "SA | INGLIST - Display all resource states"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},INGLIST"
        verbose: false
      register: inglist_output

    - name: "SA | INGLIST - Show raw operator response"
      ansible.builtin.debug:
        msg: "{{ inglist_output.stdout_lines }}"

    # -------------------------------------------------------------------------
    # Parse INGLIST into sa_inglist: [{name, type, system, compound, desired,
    #                                   observed}, ...]
    # Valid data line (after strip):
    #   "FTPSERVE    APL  LTE1         SATISFACTORY AVAILABLE    AVAILABLE"
    # Columns: Name(0) Type(1) System(2) Sus(3-optional) Compound Desired
    #          Observed
    # Skip: blank, separator, header (Name), console noise, Sysplex line.
    # -------------------------------------------------------------------------
    - name: "SA | INGLIST - Parse response into resource state list"
      ansible.builtin.set_fact:
        sa_inglist: >-
          {{
            sa_inglist | default([]) + [{
              'name':     (item | trim).split()[0],
              'type':     (item | trim).split()[1],
              'system':   (item | trim).split()[2],
              'compound': (item | trim).split()[3],
              'desired':  (item | trim).split()[4],
              'observed': (item | trim).split()[5]
            }]
          }}
      loop: "{{ inglist_output.stdout_lines }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('-')
        - not (item | trim).startswith('*')
        - not (item | trim).startswith('Name')
        - not (item | trim).startswith('ISF')
        - not (item | trim).startswith('LTE')
        - not (item | trim).startswith('Sysplex')
        - not (item | trim).startswith('RESPONSE=')
        - not (item | trim is search('-F '))
        - ((item | trim).split() | length) >= 6

    - name: "SA | INGLIST - Show parsed resource state list"
      ansible.builtin.debug:
        msg: "{{ sa_inglist }}"

    # =========================================================================
    # 3. INGREQ REQ=STOP  -  Create a STOP request (operator vote) for resource
    #
    #    Syntax:
    #      F <proc>,INGREQ <resource>/<type>/<system> REQ=STOP OUTMODE=LINE VERIFY=NO
    #
    #    INGREQ is the correct SA z/OS command to submit an operator request
    #    against a resource.  REQ=STOP asks SA to stop the resource according
    #    to its automation policy.  OUTMODE=LINE produces line-mode (non-full-
    #    screen) output suitable for operator console capture.  VERIFY=NO
    #    suppresses the interactive confirmation panel.
    # =========================================================================
    - name: "SA | INGREQ - Create STOP request for {{ target_resource }}/{{ target_type }}/{{ target_system }}"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},INGREQ {{ target_resource }}/{{ target_type }}/{{ target_system }} REQ=STOP OUTMODE=LINE VERIFY=NO"
        verbose: false
      register: ingreq_stop_output

    - name: "SA | INGREQ STOP - Show operator response"
      ansible.builtin.debug:
        msg: "{{ ingreq_stop_output.stdout_lines }}"

    # =========================================================================
    # 4. INGVOTE  -  View all outstanding votes for the resource
    #
    #    Syntax:
    #      F <proc>,INGVOTE <resource>/<type>/<system> OUTMODE=LINE
    #
    #    INGVOTE with no REQUEST= keyword displays the current vote table
    #    for the specified resource, showing who submitted each vote and
    #    what the resulting desired state is.
    # =========================================================================
    - name: "SA | INGVOTE - View votes for {{ target_resource }}/{{ target_type }}/{{ target_system }}"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},INGVOTE {{ target_resource }}/{{ target_type }}/{{ target_system }} OUTMODE=LINE"
        verbose: false
      register: ingvote_view_output

    - name: "SA | INGVOTE - Show current vote table for {{ target_resource }}"
      ansible.builtin.debug:
        msg: "{{ ingvote_view_output.stdout_lines }}"

    # -------------------------------------------------------------------------
    # Wait 30 seconds to allow SA z/OS to action the STOP request, then check
    # the single-resource state with INGLIST before cancelling.
    # -------------------------------------------------------------------------
    - name: "SA | Wait 30 seconds for SA z/OS to action the STOP request"
      ansible.builtin.wait_for:
        timeout: 30

    - name: "SA | INGLIST - Check {{ target_resource }} state after STOP request"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},INGLIST {{ target_resource }}/{{ target_type }}/{{ target_system }}"
        verbose: false
      register: inglist_mid_output

    - name: "SA | INGLIST - Parse mid-request state for {{ target_resource }}"
      ansible.builtin.set_fact:
        sa_inglist_mid: >-
          {{
            sa_inglist_mid | default([]) + [{
              'name':     (item | trim).split()[0],
              'type':     (item | trim).split()[1],
              'system':   (item | trim).split()[2],
              'compound': (item | trim).split()[3],
              'desired':  (item | trim).split()[4],
              'observed': (item | trim).split()[5]
            }]
          }}
      loop: "{{ inglist_mid_output.stdout_lines }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('-')
        - not (item | trim).startswith('*')
        - not (item | trim).startswith('Name')
        - not (item | trim).startswith('ISF')
        - not (item | trim).startswith('LTE')
        - not (item | trim).startswith('Sysplex')
        - not (item | trim).startswith('RESPONSE=')
        - not (item | trim is search('-F '))
        - ((item | trim).split() | length) >= 6
        - (item | trim).split()[0] == target_resource

    - name: "SA | INGLIST - Show mid-request state of {{ target_resource }}"
      ansible.builtin.debug:
        msg: "{{ sa_inglist_mid | default([]) }}"

    # =========================================================================
    # 5. INGSET CANCEL  -  Cancel the STOP request to allow recovery
    #
    #    Syntax:
    #      F <proc>,INGSET CANCEL <resource>/<type>/<system>
    #        REQUEST=MAKEUNAVAILABLE SOURCE=OPERATOR OUTMODE=LINE VERIFY=NO
    #
    #    INGSET CANCEL removes the operator-submitted MAKEUNAVAILABLE (STOP)
    #    request from the vote table.  Once all STOP/MAKEUNAVAILABLE votes are
    #    cleared SA z/OS can bring the resource back to its desired AVAILABLE
    #    state per the automation policy.  SOURCE=OPERATOR targets only votes
    #    cast by operators (not by automation policies).
    # =========================================================================
    - name: "SA | INGSET - Cancel STOP request for {{ target_resource }}/{{ target_type }}/{{ target_system }}"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},INGSET CANCEL {{ target_resource }}/{{ target_type }}/{{ target_system }} REQUEST=MAKEUNAVAILABLE SOURCE=OPERATOR OUTMODE=LINE VERIFY=NO"
        verbose: false
      register: ingset_cancel_output

    - name: "SA | INGSET CANCEL - Show operator response"
      ansible.builtin.debug:
        msg: "{{ ingset_cancel_output.stdout_lines }}"

    # =========================================================================
    # 6. Post-cancel INGLIST - Confirm final state of the target resource
    # =========================================================================
    - name: "SA | INGLIST - Check {{ target_resource }} final state after CANCEL"
      ibm.ibm_zos_core.zos_operator:
        cmd: "F {{ sa_proc }},INGLIST {{ target_resource }}/{{ target_type }}/{{ target_system }}"
        verbose: false
      register: inglist_post_output

    - name: "SA | INGLIST - Parse final state for {{ target_resource }}"
      ansible.builtin.set_fact:
        sa_inglist_post: >-
          {{
            sa_inglist_post | default([]) + [{
              'name':     (item | trim).split()[0],
              'type':     (item | trim).split()[1],
              'system':   (item | trim).split()[2],
              'compound': (item | trim).split()[3],
              'desired':  (item | trim).split()[4],
              'observed': (item | trim).split()[5]
            }]
          }}
      loop: "{{ inglist_post_output.stdout_lines }}"
      when:
        - item | trim | length > 0
        - not (item | trim).startswith('-')
        - not (item | trim).startswith('*')
        - not (item | trim).startswith('Name')
        - not (item | trim).startswith('ISF')
        - not (item | trim).startswith('LTE')
        - not (item | trim).startswith('Sysplex')
        - not (item | trim).startswith('RESPONSE=')
        - not (item | trim is search('-F '))
        - ((item | trim).split() | length) >= 6
        - (item | trim).split()[0] == target_resource

    - name: "SA | INGLIST - Show final state of {{ target_resource }}"
      ansible.builtin.debug:
        msg: "{{ sa_inglist_post | default([]) }}"
