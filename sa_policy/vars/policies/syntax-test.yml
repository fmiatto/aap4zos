---
# =============================================================================
# File    : vars/policies/syntax-test.yml   (sa_policies name: syntax-test)
# Purpose : TEST PDB ONLY - one entry of every kind the template can write,
#           to check the text-file syntax with SA's update report and build:
#             two classes (one linked to the other), class messages with a
#             multi-line AT override, CAPMSGS, minor resources with
#             thresholds, commands longer than 80 columns.
#           sa_test_only: true makes the run fail unless -e sa_test_pdb is set:
#
#   ansible-playbook -i sa_policy/inventory/local/inventory.yml \
#     sa_policy/playbooks/add_to_sa.yml \
#     -e sa_test_pdb=SYSAUTO.PROTO.TESTPDB -e sa_policies=syntax-test \
#     --tags apply,build
#
#           Again on the same test PDB: add -e sa_test_pdb_refresh=true (a
#           fresh copy of the live PDB; NEW fails on entries that exist).
#           APL thresholds: syntax-test-thresholds.yml, run after this file.
#           The build report ($BLDRPT in <test pdb>.SOCNTL) names the
#           members SA built for C_SAT_BASE, C_SAT_CHILD and SATAPL1.
# =============================================================================
sa_test_only: true
sa_update_only: false

sa_new_policy:

  classes:
    - name: C_SAT_BASE
      subsystem: C_SAT_BASE           # max 11 characters
      description: Syntax test - base class
      long_description:
        - Base class of the syntax test policy
      messages:
        - id: SATM001I
          description: Syntax test resource is up
          at: { status: UP }
        - id: SATM002I
          description: Syntax test AT override
          at:
            override:
              - "* Syntax test: AT override written as continuation lines"
              - "IF MSGID = 'SATM002I' THEN BEGIN;"
              - "  ALWAYS"
              - "  EXEC(CMD('INGMON SATAPL1,STATUS=NORMAL')ROUTE(ONE %AOFOPGSSOPER%));"
              - "END;"
        - id: SATM003A
          description: Syntax test reply
          reply:
            - { text: "CONTINUE THE SYNTAX TEST: A 61-CHARACTER REPLY, SA'S MAXIMUM." }
      startup:
        - phase: STARTUP
          mixed_case: "NO"
          commands:
            - { type: NORM, command: "MVS S &SUBSJOB,PARM='SATEST A START PARAMETER STRING THAT IS LONGER THAN EIGHTY COLUMNS IN THE TEXT FILE'" }
      shutdown:
        - phase: NORM
          mixed_case: "NO"
          passes:
            - { pass: 1, command: "MVS P &SUBSJOB" }
            - { pass: 2, command: "MVS C &SUBSJOB" }
      minor_resources:
        - name: TRAN
          thresholds:
            critical_number: 2
            critical_interval: "00:05:00"
            frequent_number: 4
            frequent_interval: "01:00:00"
            infrequent_number: 5
            infrequent_interval: "24:00:00"

    - name: C_SAT_CHILD
      subsystem: C_SAT_CHD
      description: Syntax test - child class
      link_to_class: C_SAT_BASE       # class linked to a class
      skip_active_status: "YES"
      relationships:
        - { type: HASPARENT, resource: TCPIP/APL/= }

  apg:
    name: SAT_TEST
    type: SYSTEM
    nature: BASIC
    description: Syntax test group
    systems:
      - LTE1

  apls:
    - name: SATAPL1
      subsystem: SATAPL1
      job_name: SATAPL1
      job_type: MVS
      link_to_class: C_SAT_CHILD
      description: Syntax test application
      messages:
        - id: CAPMSGS
          description: Message capturing (syntax test)
          capture:
            - { msgid: SATM009E, jobname: "*", severity: CRITICAL, alert: "YES" }
            - { msgid: SATM010W, jobname: "*", severity: IMPORTANT, alert: "NO" }
      shutdown:
        - phase: IMMED
          passes:
            - { pass: 1, command: "MVS F &SUBSJOB,STOP IMMEDIATE WITH A COMMAND TEXT LONGER THAN EIGHTY COLUMNS IN THE FILE" }
            - { pass: 2, command: "MVS C &SUBSJOB" }

  update_sections:
    apg: false
    description: true
    application_info: true
    relationships: true
    messages: true
    startup: true
    shutdown: true
    minor_resources: true
    thresholds: false
    db2_control: false
